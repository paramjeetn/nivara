[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-energy-intelligence"
version = "0.1.0"
description = "Campus Energy Intelligence Platform - Sustainable Facility Dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "pydantic>=2.5,<3.0",
    "fastapi>=0.104,<1.0",
    "uvicorn>=0.24,<1.0",
    "scikit-learn>=1.3,<2.0",
    "streamlit>=1.29,<2.0",
    "plotly>=5.18,<6.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.25,<1.0",
    "python-dateutil>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-asyncio>=0.21,<1.0",
]

[project.scripts]
generate-data = "campus_energy.simulator.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
