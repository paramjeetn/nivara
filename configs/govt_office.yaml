            type: "lighting"
            name: "Counter Hall Lights"
            rated_power_kw: 3.0
            equipment_count: 30
            unit_power_kw: 0.1
          - id: "EQ-MAIN-GF-AC"
            type: "hvac"
            name: "Counter Hall HVAC"
            rated_power_kw: 8.0
