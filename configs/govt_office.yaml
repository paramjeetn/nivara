schedules:
  SCH-OFFICE:
    name: "Government Office Hours"
    working_days: [1, 2, 3, 4, 5]
    slots:
      - start: "09:00"
        end: "13:00"
        occupancy_fraction: 0.85
      - start: "13:00"
        end: "14:00"
        occupancy_fraction: 0.20
      - start: "14:00"
        end: "17:30"
        occupancy_fraction: 0.80

  SCH-MEETING:
    name: "Meeting Room Schedule"
    working_days: [1, 2, 3, 4, 5]
    slots:
      - start: "10:00"
        end: "12:00"
        occupancy_fraction: 0.65
      - start: "14:00"
        end: "16:00"
        occupancy_fraction: 0.55

  SCH-24HR:
    name: "24x7 Server Room"
    working_days: [1, 2, 3, 4, 5, 6, 7]
    slots:
      - start: "00:00"
        end: "23:59"
        occupancy_fraction: 0.90

  SCH-RECORD:
    name: "Record Room Access"
    working_days: [1, 2, 3, 4, 5]
    slots:
      - start: "10:00"
        end: "16:00"
        occupancy_fraction: 0.30

  SCH-PUMP:
    name: "Water Pump Schedule"
    working_days: [1, 2, 3, 4, 5, 6, 7]
    slots:
      - start: "06:00"
        end: "09:00"
        occupancy_fraction: 1.0
      - start: "12:00"
        end: "14:00"
        occupancy_fraction: 1.0
      - start: "17:00"
