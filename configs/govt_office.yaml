  - date: "2025-09-07"
    name: "Gandhi Jayanti Observed"
  - date: "2025-09-15"
    name: "Independence Day Observed"
  - date: "2025-09-21"
    name: "State Foundation Day"

weather:
  base_temperature_c: 33.0
  daily_amplitude_c: 6.0
  multi_day_amplitude_c: 2.5
  multi_day_period_days: 7
  peak_hour: 14
  base_humidity_pct: 68.0
  humidity_amplitude_pct: 14.0
  noise_std_temperature_c: 0.5
  noise_std_humidity_pct: 2.0

sensor:
  noise_power_fraction: 0.02
  noise_voltage_std_v: 1.5
  noise_current_fraction: 0.02
  noise_pf_std: 0.01
  noise_flow_fraction: 0.03
  noise_temperature_std_c: 0.3
  nominal_voltage_v: 230.0
  nominal_power_factor: 0.85

replay:
  default_speed: 360
  batch_size: 50
