# Government Office Complex — Simulation Configuration
# Mon-Fri 9-5 ops, strong weekend phantom load problem, meeting rooms, public counters

simulation:
  start_date: "2025-09-01T00:00:00+05:30"
  end_date: "2025-09-29T00:00:00+05:30"
  interval_minutes: 5
  timezone: "Asia/Kolkata"
  seed: 202
  version: "1.0.0"

campus:
  name: "Collectorate Office Complex"
  location: "Bhubaneswar, Odisha, India"
  facility_type: "govt_office"
  floor_area_m2: 5200
