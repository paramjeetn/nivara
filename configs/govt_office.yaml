        floor: 3
        capacity: 30
        schedule_id: "SCH-OFFICE"
        equipment:
          - id: "EQ-MAIN-OF2-LT"
            type: "lighting"
            name: "Admin Floor Lights"
            rated_power_kw: 2.0
            equipment_count: 20
            unit_power_kw: 0.1
          - id: "EQ-MAIN-OF2-AC"
            type: "hvac"
            name: "Admin Floor HVAC"
            rated_power_kw: 8.0
