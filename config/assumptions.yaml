# =============================================================================
# Nivara — Platform Assumptions Registry
#
# Every number in Nivara is traceable, defensible, and documented.
# Each entry defines:
#   - key: Dot-delimited identifier
#   - value: Numeric or typed value
#   - unit: Physical or financial unit
#   - description: Human-readable explanation
#   - source: Regulatory standard, tariff order, or empirical study
#   - source_date: Publication or effective date
#   - confidence: high | medium | low | needs_verification
#   - applies_to: List of facility types or ["all"]
#   - notes: Optional technical notes or TODO verification items
# =============================================================================

